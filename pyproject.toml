[project]
name = "clearview-ml"
version = "0.1.0"
description = "Clearview Properties case study: price ranges, price drivers, improvement ROI and market segmentation (EAFIT ML final project)."
requires-python = "==3.12.*"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
